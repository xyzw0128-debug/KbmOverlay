# Builds KbmOverlay.exe on GitHub and attaches it to a release.
#
#   1. Set <Version> in KbmOverlay.csproj (e.g. 0.3.1) and push the commit.
#   2. git tag v0.3.1 && git push origin v0.3.1
#
# The tag must match <Version>, so the exe always reports the version it was released as.
# Running it by hand (Actions > Release > Run workflow) only builds and keeps the exe as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-Xml -Path KbmOverlay.csproj -XPath '//Version').Node.InnerText
          if ("v$version" -ne '${{ github.ref_name }}') {
            Write-Error "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in KbmOverlay.csproj."
            exit 1
          }

      - name: Build
        run: dotnet build -c Release -nologo

      - name: Keep the exe as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KbmOverlay
          path: bin/Release/net48/KbmOverlay.exe

      - name: Attach the exe and license files to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $exe = 'bin/Release/net48/KbmOverlay.exe'
          # MIT asks for the notices to go with every copy, so they ship next to the exe.
          $files = @($exe, 'LICENSE', 'THIRD-PARTY-NOTICES.txt')
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @"
          KbmOverlay.exe for Windows 10/11. No installation needed; see the README for how to use it.

          If Windows says "Windows protected your PC" on first run, choose **More info → Run anyway** (the exe is not code-signed).

          Key input is never saved or sent to the internet. Not an official OBS Studio program.
          The MIT license and the notices for the projects it uses are in LICENSE and THIRD-PARTY-NOTICES.txt, and under "Licenses and credits" on the settings page while it runs.

          This exe was built by GitHub Actions from the source of this tag.
          SHA-256: ``$hash``

          ---

          Windows 10/11용 KbmOverlay.exe예요. 설치 없이 바로 실행돼요. 사용법은 README.ko.md를 보세요.
          처음 실행할 때 "PC를 보호했습니다"가 나오면 **추가 정보 → 실행**을 누르세요 (코드 서명이 없는 exe라서 나와요).
          키 입력을 저장하거나 인터넷으로 보내지 않아요. OBS Studio의 공식 프로그램이 아니에요.
          "@
          # A file avoids quoting problems with multi-line text passed to gh.
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release made by hand already: replace the files on it.
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "KbmOverlay $($tag.TrimStart('v'))" --notes-file $notesFile
          }
