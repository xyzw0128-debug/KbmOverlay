<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mouse</title>
    <link rel="stylesheet" href="theme.css">
    <script src="overlay.js"></script>
    <script src="mouse.js"></script>
    <style>
        #mouse { display: inline-block; padding: 12px; transform-origin: 0 0; }
        #mouse svg { display: block; width: 200px; height: auto; overflow: visible; }
    </style>
    <link rel="stylesheet" href="custom.css"> <!-- your own look, last so it wins (see custom.css) -->
</head>
<body>
    <div id="mouse"></div>
    <script>
        // mouse.html?scale=1.5 (and ?fade= / ?glowsize= / ?idle= / ?press=, see overlay.js)
        (function () {
            'use strict';

            var holder = document.getElementById('mouse');
            Overlay.mouse(holder).then(function (mouse) {
                var scale = Overlay.number('scale', 1, 0.25, 4);
                holder.style.transform = 'scale(' + scale + ')';
                Overlay.reportSize(mouse.width * scale, mouse.height * scale);
                Overlay.connect(['button', 'wheel']).on('button', mouse.button).on('wheel', mouse.wheel);
            }, function (error) {
                Overlay.showError(error.message);
            });
        })();
    </script>
</body>
</html>
