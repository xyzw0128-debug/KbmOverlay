<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Counter</title>
    <link rel="stylesheet" href="theme.css">
    <script src="overlay.js"></script>
    <style>
        #counter { display: inline-flex; gap: 8px; padding: 12px; transform-origin: 0 0; }
        .count { box-sizing: border-box; min-width: 88px; padding: 6px 12px 8px; border: 2px solid var(--line);
                 border-radius: var(--key-radius); color: var(--line); font-family: var(--font); text-align: center;
                 opacity: var(--idle-opacity); transition: opacity 0.3s; }
        .count.active { opacity: 1; }
        .count .value { font-size: 34px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
        .count .label { font-size: 13px; letter-spacing: 1px; opacity: 0.75; }
    </style>
    <link rel="stylesheet" href="custom.css"> <!-- your own look, last so it wins (see custom.css) -->
</head>
<body>
    <div id="counter"></div>
    <script>
        // counter.html?show=&scale=1.5
        // Presses in the last second: show= (empty) KPS and CPS, kps, cps, or lr (left and right button CPS).
        // KPS counts every key press, CPS every mouse button press.
        (function () {
            'use strict';

            var WINDOW = 1000; // ms counted
            var SHOWS = {
                '': [{ label: 'KPS', type: 'key' }, { label: 'CPS', type: 'button' }],
                kps: [{ label: 'KPS', type: 'key' }],
                cps: [{ label: 'CPS', type: 'button' }],
                lr: [{ label: 'L CPS', type: 'button', name: 'Mouse1' }, { label: 'R CPS', type: 'button', name: 'Mouse2' }]
            };
            var counters = SHOWS[Overlay.params.get('show') || ''] || SHOWS[''];

            var holder = document.getElementById('counter');
            counters.forEach(function (counter) {
                var box = document.createElement('div');
                box.className = 'count';
                box.innerHTML = '<div class="value">0</div><div class="label"></div>';
                box.querySelector('.label').textContent = counter.label;
                holder.appendChild(box);
                counter.box = box;
                counter.value = box.querySelector('.value');
                counter.times = []; // when each counted press happened
            });

            var scale = Overlay.number('scale', 1, 0.25, 4);
            var width = holder.offsetWidth, height = holder.offsetHeight;
            holder.style.transform = 'scale(' + scale + ')';
            Overlay.reportSize(width * scale, height * scale);

            // Shows the counts; runs every 100 ms only while a press is less than a second old.
            var timer = null;
            function refresh() {
                var now = performance.now();
                var counting = false;
                counters.forEach(function (counter) {
                    while (counter.times.length && now - counter.times[0] >= WINDOW) counter.times.shift();
                    counter.value.textContent = counter.times.length;
                    counter.box.classList.toggle('active', counter.times.length > 0);
                    if (counter.times.length) counting = true;
                });
                if (counting && !timer) timer = setInterval(refresh, 100);
                if (!counting && timer) {
                    clearInterval(timer);
                    timer = null;
                }
            }

            function press(type, name) {
                var now = performance.now();
                counters.forEach(function (counter) {
                    if (counter.type === type && (!counter.name || counter.name === name)) counter.times.push(now);
                });
                refresh();
            }

            Overlay.connect(['key', 'button'])
                .on('key', function (name, down) { if (down) press('key', name); })
                .on('button', function (name, down) { if (down) press('button', name); });
        })();
    </script>
</body>
</html>
