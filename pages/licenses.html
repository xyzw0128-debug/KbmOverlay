<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KbmOverlay</title>
    <script src="overlay.js"></script>
    <style>
        :root {
            --bg: #16171a;
            --card: #1f2126;
            --line: #33363d;
            --text: #e8e9ec;
            --muted: #9a9ea8;
            --font: "Segoe UI", "Malgun Gothic", "Yu Gothic UI", "Microsoft YaHei UI", sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); }
        main { max-width: 860px; margin: 0 auto; padding: 28px 16px 48px; }
        h1 { font-size: 22px; margin: 0 0 6px; }
        h2 { font-size: 17px; margin: 0 0 10px; }
        a { color: #8ab4f8; }
        .muted { color: var(--muted); }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 16px; }
        pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 Consolas, monospace; color: var(--text); }
    </style>
</head>
<body>
<main>
    <h1 data-i18n="licenses.title"></h1>
    <p class="muted" style="margin:0">
        <span data-i18n="licenses.intro"></span>
        <a href="/" data-i18n="licenses.back"></a>
    </p>

    <section class="card">
        <h2>KbmOverlay</h2>
        <pre id="license" data-i18n="licenses.loading"></pre>
    </section>

    <section class="card">
        <h2 data-i18n="licenses.others"></h2>
        <pre id="notices" data-i18n="licenses.loading"></pre>
    </section>
</main>
<script>
    // Both texts are built into the exe (see KbmOverlay.csproj).
    Overlay.i18n().then(function (t) {
        Overlay.translate(t, document);
        document.title = t('licenses.title') + ' · KbmOverlay';
        [['license', 'licenses/LICENSE.txt'], ['notices', 'licenses/THIRD-PARTY-NOTICES.txt']].forEach(function (pair) {
            fetch(pair[1])
                .then(function (response) { return response.ok ? response.text() : Promise.reject(new Error(pair[1])); })
                .then(function (text) { document.getElementById(pair[0]).textContent = text; })
                .catch(function () { document.getElementById(pair[0]).textContent = t('licenses.loadFailed', { file: pair[1] }); });
        });
    });
</script>
</body>
</html>
