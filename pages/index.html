<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KbmOverlay</title>
    <script src="overlay.js"></script>
    <style>
        :root {
            --bg: #16171a;
            --card: #1f2126;
            --line: #33363d;
            --text: #e8e9ec;
            --muted: #9a9ea8;
            --accent: #2DA026;
            --warn: #f2b84b;
            --bad: #e5534b;
            --font: "Segoe UI", "Malgun Gothic", "Yu Gothic UI", "Microsoft YaHei UI", sans-serif;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); }
        main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
        h1 { font-size: 22px; margin: 0; }
        h2 { font-size: 17px; margin: 0 0 12px; }
        h3 { font-size: 15px; margin: 0 0 8px; }
        .muted { color: var(--muted); }
        .good { color: var(--accent); }
        .warn { color: var(--warn); }
        .bad { color: var(--bad); }
        header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px; margin-bottom: 20px; }
        .header-main { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; min-width: 0; }
        /* Top-right corner, with a globe so it can be found in a language you cannot read. */
        .language { flex-shrink: 0; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
        .language svg { width: 16px; height: 16px; color: var(--muted); }
        .language select { border: 0; background: transparent; padding: 3px 2px; cursor: pointer; }
        .language select option { background: var(--card); color: var(--text); }
        .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
        .pill.ok .dot { background: var(--accent); }
        .last-input { font-variant-numeric: tabular-nums; }
        .notice { border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
        .banner { border: 2px solid var(--warn); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; background: var(--card); }
        .banner p { margin: 0 0 6px; }
        .banner .code { font: 600 28px/1.2 Consolas, monospace; letter-spacing: 2px; color: var(--warn); }
        ol.steps { margin: 0; padding-left: 20px; }
        ol.steps li { margin: 2px 0; }
        .options { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; align-items: center; }
        label { color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        select, input[type=number] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
        input[type=number] { width: 80px; }
        .preview { position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 12px; min-height: 60px;
                   background: #0b0c0e repeating-conic-gradient(#14161a 0% 25%, #0b0c0e 0% 50%) 0 0 / 24px 24px; }
        .preview iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: transparent; }
        .url-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .url-row input { flex: 1 1 320px; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: 14px Consolas, monospace; }
        button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 16px; font: inherit; cursor: pointer; }
        button:active { transform: translateY(1px); }
        button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
        button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
        button:disabled { opacity: 0.5; cursor: default; }
        .size { margin-top: 8px; font-size: 14px; }
        .size b { font-variant-numeric: tabular-nums; }
        code { font-family: Consolas, monospace; font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
        .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
        .row input { flex: 1 1 200px; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; }
        .relay-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
        .relay-box { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
        .relay-box p { margin: 0; }
        .peer-list { list-style: none; margin: 10px 0 0; padding: 0; }
        .peer-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
        .peer-list li:first-child { border-top: 0; }
        .peer-list button { flex-shrink: 0; white-space: nowrap; }
        footer { margin-top: 24px; font-size: 13px; line-height: 1.8; }
        footer a { color: #8ab4f8; }
    </style>
</head>
<body>
<main>
    <header>
        <div class="header-main">
            <h1>KbmOverlay</h1>
            <span class="pill" id="status"><span class="dot"></span><span id="status-text" data-i18n="status.connecting"></span></span>
            <span class="pill ok" id="relay-pill" hidden><span class="dot"></span><span id="relay-pill-text"></span></span>
            <span class="muted last-input" id="last-input" data-i18n="input.hint"></span>
        </div>
        <label class="language" data-i18n-title="language.label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
            </svg>
            <select id="language" data-i18n-aria="language.label"></select>
        </label>
    </header>

    <div class="banner" id="approval" hidden>
        <p id="approval-text"></p>
        <p><span data-i18n="approval.code"></span> <span class="code" id="approval-code"></span></p>
        <p class="muted" data-i18n="approval.hint"></p>
        <div class="row">
            <button type="button" id="approve" data-i18n="approval.allow"></button>
            <button type="button" class="secondary" id="deny" data-i18n="approval.deny"></button>
        </div>
    </div>

    <div class="banner" id="waiting" hidden>
        <p id="waiting-text"></p>
        <p><span data-i18n="approval.code"></span> <span class="code" id="waiting-code"></span></p>
        <p class="muted" data-i18n="waiting.hint"></p>
    </div>

    <div class="notice" id="admin-notice" data-i18n="admin.notice" hidden></div>

    <section class="card">
        <h2 data-i18n="obs.title"></h2>
        <ol class="steps">
            <li data-i18n-html="obs.step1"></li>
            <li data-i18n-html="obs.step2"></li>
            <li data-i18n-html="obs.step3"></li>
        </ol>
        <p class="muted" style="margin:10px 0 0" data-i18n="obs.reconnect"></p>
    </section>

    <section class="card" id="relay">
        <h2 data-i18n="relay.title"></h2>
        <p class="muted" style="margin:0 0 12px">
            <span data-i18n-html="relay.intro"></span>
            <b id="relay-machine">…</b> <span id="relay-addresses"></span>
        </p>
        <div class="relay-grid">
            <div class="relay-box">
                <h3 data-i18n-html="receive.title"></h3>
                <p id="receive-text" class="muted">…</p>
                <div class="row">
                    <button type="button" id="receive-toggle" data-i18n="receive.turnOn"></button>
                    <button type="button" id="allow-public" data-i18n="receive.allowPublic" hidden></button>
                    <button type="button" class="secondary" id="network-settings" data-i18n="receive.networkSettings" hidden></button>
                </div>
                <div class="row" id="public-note" hidden>
                    <span class="muted" data-i18n="receive.publicNote"></span>
                    <button type="button" class="secondary" id="disallow-public" data-i18n="receive.disallowPublic"></button>
                </div>
                <ul class="peer-list" id="paired-list"></ul>
            </div>
            <div class="relay-box">
                <h3 data-i18n="send.title"></h3>
                <p id="send-text" class="muted">…</p>
                <ul class="peer-list" id="found-list"></ul>
                <div class="row">
                    <input id="manual-address" data-i18n-placeholder="send.manualPlaceholder" data-i18n-aria="send.manualLabel">
                    <button type="button" class="secondary" id="manual-connect" data-i18n="send.manualConnect"></button>
                </div>
                <p class="bad" id="manual-error" style="margin-top:6px" hidden></p>
                <div class="row">
                    <button type="button" class="secondary" id="search" data-i18n="send.search"></button>
                    <button type="button" class="danger" id="stop-sending" data-i18n="send.stop" hidden></button>
                </div>
            </div>
        </div>
    </section>

    <section class="card" data-page="keyboard.html">
        <h2 data-i18n="keyboard.title"></h2>
        <div class="options">
            <label><span data-i18n="keyboard.layout"></span>
                <select data-param="layout">
                    <option value="" data-i18n="layout.wasd"></option>
                    <option value="tkl" data-i18n="layout.tkl"></option>
                    <option value="full" data-i18n="layout.full"></option>
                </select>
            </label>
            <label><span data-i18n="option.scale"></span> <input type="number" data-param="scale" min="0.25" max="4" step="0.25" placeholder="1"></label>
        </div>
        <div class="preview"><iframe data-i18n-title="preview.keyboard"></iframe></div>
        <div class="url-row"><input readonly data-i18n-aria="obs.urlLabel"><button type="button" data-i18n="copy"></button></div>
        <div class="size muted"></div>
    </section>

    <section class="card" data-page="mouse.html">
        <h2 data-i18n="mouse.title"></h2>
        <div class="options">
            <label><span data-i18n="option.scale"></span> <input type="number" data-param="scale" min="0.25" max="4" step="0.25" placeholder="1"></label>
        </div>
        <div class="preview"><iframe data-i18n-title="preview.mouse"></iframe></div>
        <div class="url-row"><input readonly data-i18n-aria="obs.urlLabel"><button type="button" data-i18n="copy"></button></div>
        <div class="size muted"></div>
    </section>

    <section class="card" data-page="mouse-move.html">
        <h2 data-i18n="mouseMove.title"></h2>
        <div class="options">
            <label><span data-i18n="option.size"></span> <input type="number" data-param="size" min="120" max="2000" step="20" placeholder="400"></label>
            <label><span data-i18n="option.sens"></span> <input type="number" data-param="sens" min="0.05" max="20" step="0.25" placeholder="1"></label>
            <span class="muted" data-i18n="mouseMove.hint"></span>
        </div>
        <div class="preview"><iframe data-i18n-title="preview.mouseMove"></iframe></div>
        <div class="url-row"><input readonly data-i18n-aria="obs.urlLabel"><button type="button" data-i18n="copy"></button></div>
        <div class="size muted"></div>
    </section>

    <section class="card">
        <h2 data-i18n="custom.title"></h2>
        <p style="margin:0" data-i18n-html="custom.text"></p>
    </section>

    <footer class="muted">
        <span data-i18n="footer.privacy"></span><br>
        <a href="licenses.html" data-i18n="footer.licenses"></a> ·
        <a href="https://github.com/xyzw0128-debug/KbmOverlay" target="_blank" rel="noopener">GitHub</a>
    </footer>
</main>
<script>
    Overlay.i18n().then(function (t) {
        'use strict';

        var info = t.info;
        Overlay.translate(t, document);
        document.title = info.version ? t('page.titleVersion', { version: info.version }) : t('page.title');
        document.getElementById('admin-notice').hidden = info.elevated !== false;

        // ---- language ----

        var languageSelect = document.getElementById('language');
        function addOption(value, label) {
            var option = document.createElement('option');
            option.value = value;
            option.textContent = label;
            languageSelect.appendChild(option);
        }
        addOption('auto', t('language.auto', { name: info.systemLang || 'English' }));
        (info.languages || []).forEach(function (language) { addOption(language.code, language.name); });
        languageSelect.value = info.langSetting || 'auto';

        // ---- overlay cards ----

        function setupCard(card) {
            var page = card.getAttribute('data-page');
            var iframe = card.querySelector('iframe');
            var preview = card.querySelector('.preview');
            var urlInput = card.querySelector('.url-row input');
            var copyButton = card.querySelector('.url-row button');
            var sizeText = card.querySelector('.size');
            var controls = Array.prototype.slice.call(card.querySelectorAll('[data-param]'));
            var size = null;

            function url() {
                var parts = [];
                controls.forEach(function (control) {
                    var value = control.value.trim();
                    if (value !== '') parts.push(control.getAttribute('data-param') + '=' + encodeURIComponent(value));
                });
                return location.origin + '/' + page + (parts.length ? '?' + parts.join('&') : '');
            }

            function fit() {
                if (!size) return;
                var scale = Math.min(1, preview.clientWidth / size[0]);
                iframe.style.width = size[0] + 'px';
                iframe.style.height = size[1] + 'px';
                iframe.style.transform = 'scale(' + scale + ')';
                preview.style.height = Math.ceil(size[1] * scale) + 'px';
            }

            function update() {
                var value = url();
                urlInput.value = value;
                sizeText.textContent = t('size.measuring');
                iframe.src = value;
            }

            controls.forEach(function (control) { control.addEventListener('change', update); });

            copyButton.addEventListener('click', function () {
                function done() {
                    copyButton.textContent = t('copied');
                    setTimeout(function () { copyButton.textContent = t('copy'); }, 1500);
                }
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(urlInput.value).then(done, function () {
                        urlInput.select();
                        document.execCommand('copy');
                        done();
                    });
                } else {
                    urlInput.select();
                    document.execCommand('copy');
                    done();
                }
            });

            window.addEventListener('message', function (event) {
                if (event.origin !== location.origin || event.source !== iframe.contentWindow) return;
                if (!event.data || !event.data.kbmOverlaySize) return;
                size = event.data.kbmOverlaySize;
                sizeText.innerHTML = t.html('size.text', { width: size[0], height: size[1] });
                fit();
            });
            window.addEventListener('resize', fit);

            update();
        }

        Array.prototype.forEach.call(document.querySelectorAll('[data-page]'), setupCard);

        // ---- connection ----

        function $(id) { return document.getElementById(id); }

        var status = $('status');
        var connection = Overlay.connect(['key', 'button', 'relay'])
            .on('status', function (connected) {
                status.classList.toggle('ok', connected);
                $('status-text').textContent = t(connected ? 'status.connected' : 'status.off');
                if (!connected) renderRelay(null);
            })
            .on('key', function (name, down) {
                if (down) $('last-input').textContent = t('input.key', { name: name });
            })
            .on('button', function (name, down) {
                if (down) $('last-input').textContent = t('input.button', { name: t('button.' + name) });
            })
            .on('relay', renderRelay)
            .on('relayError', function (message) {
                $('manual-error').textContent = message;
                $('manual-error').hidden = false;
            });

        languageSelect.addEventListener('change', function () {
            connection.send({ cmd: 'language', lang: languageSelect.value });
            setTimeout(function () { location.reload(); }, 300);
        });

        // ---- two PCs ----

        function setText(el, text, tone) {
            el.textContent = text;
            el.className = tone || 'muted';
        }

        function peerItem(label, buttonText, buttonClass, onClick) {
            var li = document.createElement('li');
            var span = document.createElement('span');
            span.textContent = label;
            li.appendChild(span);
            if (buttonText) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = buttonClass || '';
                button.textContent = buttonText;
                if (onClick) button.addEventListener('click', onClick); else button.disabled = true;
                li.appendChild(button);
            }
            return li;
        }

        var lastRelay = null;

        function renderRelay(relay) {
            lastRelay = relay;
            var receive = relay ? relay.receive : null;
            var send = relay ? relay.send : null;

            $('relay-machine').textContent = relay ? relay.machine : '…';
            $('relay-addresses').textContent = relay && relay.addresses.length ? '(' + relay.addresses.join(', ') + ')' : '';

            // Approval prompt (streaming PC).
            var pending = receive && receive.pending;
            $('approval').hidden = !pending;
            if (pending) {
                $('approval-text').innerHTML = t.html('approval.text', { name: pending.name, address: pending.address });
                $('approval-code').textContent = pending.code;
            }

            // Waiting for approval (game PC).
            var waiting = send && send.state === 'waiting';
            $('waiting').hidden = !waiting;
            if (waiting) {
                $('waiting-text').innerHTML = t.html('waiting.text', { name: send.target });
                $('waiting-code').textContent = send.code;
            }

            // Header pill.
            var pillText = '';
            if (receive && receive.active) pillText = t('pill.showing', { name: receive.active.name });
            else if (send && send.state === 'sending') pillText = t('pill.sending', { name: send.target });
            $('relay-pill').hidden = !pillText;
            $('relay-pill-text').textContent = pillText;

            renderReceive(receive);
            renderSend(send);
        }

        function renderReceive(receive) {
            var text = $('receive-text');
            var toggle = $('receive-toggle');
            var onPublic = !!(receive && receive.on && receive.problem === 'public-network');
            $('network-settings').hidden = !onPublic;
            $('allow-public').hidden = !onPublic;
            $('public-note').hidden = !(receive && receive.on && receive.allowPublic);
            toggle.disabled = !receive;
            if (!receive) {
                setText(text, t('receive.notConnected'));
                return;
            }

            var firewallProblem = receive.problem === 'firewall-needed' || receive.problem === 'firewall-failed';
            toggle.textContent = t(!receive.on ? 'receive.turnOn' : firewallProblem ? 'receive.allowFirewall' : 'receive.turnOff');
            toggle.className = receive.on && !firewallProblem ? 'secondary' : '';

            if (!receive.on) setText(text, t('receive.offText'));
            else if (receive.problem === 'public-network') setText(text, t('receive.publicText', { port: receive.port }), 'warn');
            else if (receive.problem === 'firewall-needed') setText(text, t('receive.firewallNeededText'), 'warn');
            else if (receive.problem === 'firewall-failed') setText(text, t('receive.firewallFailedText'), 'bad');
            else if (receive.problem === 'port-in-use') setText(text, t('receive.portInUseText', { port: receive.port }), 'bad');
            else if (!receive.listening) setText(text, t('receive.starting'));
            else if (receive.active) setText(text, t('receive.activeText', { name: receive.active.name, address: receive.active.address }), 'good');
            else setText(text, t('receive.waitingText'));

            var list = $('paired-list');
            list.innerHTML = '';
            receive.paired.forEach(function (peer) {
                list.appendChild(peerItem(t('receive.paired', { name: peer.name }), t('receive.remove'), 'danger', function () {
                    if (confirm(t('receive.removeConfirm', { name: peer.name }))) connection.send({ cmd: 'forget', id: peer.id });
                }));
            });
        }

        function renderSend(send) {
            var text = $('send-text');
            var list = $('found-list');
            list.innerHTML = '';
            $('stop-sending').hidden = !(send && (send.receiver || ['connecting', 'waiting', 'retrying', 'sending', 'searching'].indexOf(send.state) >= 0));
            if (!send) {
                setText(text, t('receive.notConnected'));
                return;
            }

            var vars = { name: send.target || (send.receiver && send.receiver.name) || '' };
            switch (send.state) {
                case 'sending': setText(text, t('send.sendingText', vars), 'good'); break;
                case 'waiting': setText(text, t('send.waitingText', vars), 'warn'); break;
                case 'connecting': setText(text, t('send.connectingText', vars)); break;
                case 'searching': setText(text, t('send.searchingText', vars)); break;
                case 'retrying': setText(text, send.message || t('send.retryingText', vars), 'warn'); break;
                case 'denied': setText(text, t('send.deniedText'), 'bad'); break;
                case 'forgotten': setText(text, send.message || t('send.forgottenText'), 'warn'); break;
                default:
                    if (lastRelay && lastRelay.receive.on && !send.found.length) setText(text, t('send.isStreamingText'));
                    else setText(text, t(send.found.length ? 'send.foundText' : 'send.searchText'));
            }

            send.found.forEach(function (f) {
                var isTarget = send.receiver && send.receiver.id === f.id && send.state !== 'forgotten';
                var label = f.name + ' (' + f.address + ')';
                if (isTarget) list.appendChild(peerItem(label, t(send.state === 'sending' ? 'send.sendingBadge' : 'send.targetBadge'), 'secondary', null));
                else list.appendChild(peerItem(label, t('send.send'), '', function () { connection.send({ cmd: 'send', id: f.id }); }));
            });
        }

        $('receive-toggle').addEventListener('click', function () {
            var receive = lastRelay && lastRelay.receive;
            if (!receive) return;
            var firewallProblem = receive.problem === 'firewall-needed' || receive.problem === 'firewall-failed';
            connection.send({ cmd: 'receive', on: !receive.on || firewallProblem });
        });
        $('network-settings').addEventListener('click', function () { connection.send({ cmd: 'networkSettings' }); });
        $('allow-public').addEventListener('click', function () { connection.send({ cmd: 'allowPublic', on: true }); });
        $('disallow-public').addEventListener('click', function () { connection.send({ cmd: 'allowPublic', on: false }); });
        $('approve').addEventListener('click', function () { connection.send({ cmd: 'approve', id: lastRelay.receive.pending.id }); });
        $('deny').addEventListener('click', function () { connection.send({ cmd: 'deny', id: lastRelay.receive.pending.id }); });
        $('search').addEventListener('click', function () { connection.send({ cmd: 'search' }); });
        $('stop-sending').addEventListener('click', function () { connection.send({ cmd: 'stopSending' }); });
        $('manual-connect').addEventListener('click', function () {
            $('manual-error').hidden = true;
            connection.send({ cmd: 'sendTo', address: $('manual-address').value });
        });
    });
</script>
</body>
</html>
