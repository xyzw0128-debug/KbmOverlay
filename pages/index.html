<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KbmOverlay</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232DA026' stroke-width='2' stroke-linecap='round'%3E%3Crect x='2.5' y='6' width='19' height='12' rx='2'/%3E%3Cpath d='M6.5 10h1M10.5 10h1M14.5 10h1M8 14h8'/%3E%3C/svg%3E">
    <script src="overlay.js"></script>
    <style>
        :root {
            --bg: #16171a;
            --side: #1b1c20;
            --card: #1f2126;
            --hover: #26282e;
            --line: #33363d;
            --text: #e8e9ec;
            --muted: #9a9ea8;
            --accent: #2DA026;
            --accent-strong: #1F7F1A; /* behind white text: --accent is too light for it to read well (WCAG AA) */
            --warn: #f2b84b;
            --bad: #ec6b63;
            --link: #8ab4f8;
            --font: "Segoe UI", "Malgun Gothic", "Yu Gothic UI", "Microsoft YaHei UI", sans-serif;
            color-scheme: dark; /* scrollbars, menus and number arrows drawn dark too */
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); }
        /* No blue selection (or the browser's menu for it) when clicking fast to try the mouse, or dragging.
           Fields, codes and .selectable text worth copying (this PC's IP, errors, folder paths) can still be selected. */
        body { -webkit-user-select: none; user-select: none; }
        input, textarea, code, .code, .selectable { -webkit-user-select: text; user-select: text; }
        h2 { font-size: 20px; margin: 0 0 14px; }
        h3 { font-size: 15px; margin: 0 0 10px; }
        p { margin: 0; }
        a { color: var(--link); }
        .muted { color: var(--muted); }
        .good { color: var(--accent); }
        .warn { color: var(--warn); }
        .bad { color: var(--bad); }
        .small { font-size: 13px; }

        /* ---- menu on the left, one panel on the right ---- */
        .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
        .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
                   padding: 18px 12px; background: var(--side); border-right: 1px solid var(--line); }
        .summary { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 0 8px 16px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
        .brand { margin: 0; font-size: 18px; font-weight: 600; }
        .brand .muted { margin-left: 6px; font-size: 13px; font-weight: 400; }
        .pill { display: inline-flex; align-items: center; gap: 8px; padding: 3px 11px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
        .dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
        .pill.ok .dot { background: var(--accent); }
        .last-input { font-size: 13px; font-variant-numeric: tabular-nums; }
        nav { display: flex; flex-direction: column; gap: 2px; }
        .nav-group { padding: 12px 10px 4px; font-size: 12px; color: var(--muted); }
        nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; }
        nav a:hover { background: var(--hover); color: var(--text); }
        nav a[aria-current="page"] { background: var(--card); color: var(--text); font-weight: 600; }
        nav svg { width: 18px; height: 18px; flex-shrink: 0; }
        .badge { margin-left: auto; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--warn); color: #1a1405; font-size: 12px; font-weight: 600; text-align: center; }
        /* Bottom of the menu, with a globe so it can be found in a language you cannot read. */
        .language { margin-top: auto; display: flex; align-items: center; gap: 6px; padding: 14px 10px 0; color: var(--muted); }
        .language svg { width: 16px; height: 16px; flex-shrink: 0; }
        .language select { flex: 1; min-width: 0; }
        main { width: 100%; max-width: 1080px; padding: 28px 28px 48px; }

        /* ---- shared pieces ---- */
        .notice { border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
        .notice.closable { display: flex; align-items: flex-start; gap: 12px; }
        .notice.closable > :first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        button.close { flex-shrink: 0; display: flex; padding: 3px; margin: -2px -6px -2px 0; border-radius: 6px; background: none; color: inherit; }
        button.close:hover { background: var(--hover); }
        button.close svg { width: 16px; height: 16px; }
        .banner { border: 2px solid var(--warn); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; background: var(--card); }
        .banner p { margin: 0 0 6px; }
        .banner .code { font: 600 28px/1.2 Consolas, monospace; letter-spacing: 2px; color: var(--warn); }
        .box { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
        .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
        .columns.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .prose p + p { margin-top: 10px; }
        .intro { margin: -4px 0 16px; }
        select, input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 14px; }
        button { background: var(--accent-strong); color: #fff; border: 0; border-radius: 6px; padding: 7px 16px; font: inherit; font-size: 14px; cursor: pointer; }
        button:active { transform: translateY(1px); }
        button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
        button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
        button.link { background: none; border: 0; padding: 0; color: var(--link); font-size: 12px; }
        button:disabled { opacity: 0.5; cursor: default; }
        button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
        code { font-family: Consolas, monospace; font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
        .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
        .row input { flex: 1 1 200px; min-width: 0; padding: 7px 10px; }

        /* ---- overlay panels: big preview on top, three boxes below ---- */
        .preview { position: relative; overflow: hidden; min-height: 140px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 12px;
                   background: #0b0c0e repeating-conic-gradient(#14161a 0% 25%, #0b0c0e 0% 50%) 0 0 / 24px 24px; }
        /* color-scheme as in the overlay pages: when it differs from theirs, the browser paints the frame white
           instead of see-through. */
        .preview iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: transparent; pointer-events: none;
                          color-scheme: normal; }
        /* Preview background, top right of every preview: see-through like OBS, or a color to check effects on. */
        .preview-bg { position: absolute; top: 10px; right: 10px; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 5px 7px;
                      border: 1px solid var(--line); border-radius: 16px; background: rgba(23, 24, 27, 0.85); }
        .bg-swatch { position: relative; flex-shrink: 0; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3); cursor: pointer; }
        .bg-swatch.checker { background: #0b0c0e repeating-conic-gradient(#3a3d44 0% 25%, #0b0c0e 0% 50%) 0 0 / 10px 10px; }
        .bg-swatch.pick { background: conic-gradient(#f44, #fd4, #4d4, #4df, #46f, #d4f, #f44); }
        .bg-swatch.pick input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; opacity: 0; cursor: pointer; }
        .bg-swatch[aria-pressed="true"], .bg-swatch.pick.selected { outline: 2px solid var(--text); outline-offset: 2px; }
        .bg-swatch.pick:focus-within { outline: 2px solid var(--link); outline-offset: 2px; }
        .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
        .field select, .field input { width: 100%; }
        .url { width: 100%; margin-bottom: 8px; font: 13px Consolas, monospace; }
        .copy { width: 100%; }
        .changed { margin-top: 8px; }
        .size { margin-top: 10px; font-size: 13px; }
        .size b { color: var(--text); font-variant-numeric: tabular-nums; }
        .howto { margin-top: 10px; font-size: 13px; }
        .howto summary { cursor: pointer; color: var(--link); }
        ol.steps { margin: 8px 0; padding-left: 20px; }
        ol.steps li { margin: 2px 0; }
        .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        button.swatch { width: 28px; height: 28px; padding: 0; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15); }
        button.swatch[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 2px; }
        .color-row { display: grid; grid-template-columns: minmax(0, 1fr) 36px 92px; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
        .color-row input[type=color] { width: 36px; height: 30px; padding: 2px; cursor: pointer; }
        .hex { width: 100%; font: 13px Consolas, monospace; text-transform: uppercase; }
        .hex.invalid { border-color: var(--bad); }
        .color-footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 12px; font-size: 12px; }
        .slider { margin-bottom: 12px; font-size: 13px; color: var(--muted); }
        .slider-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
        .slider-value { color: var(--text); font-variant-numeric: tabular-nums; }
        .slider-head .link { margin-left: auto; }
        .slider input { width: 100%; margin: 0; padding: 0; border: 0; background: none; accent-color: var(--accent); cursor: pointer; }

        /* ---- picking keys by hand ---- */
        .picker { margin-bottom: 14px; }
        .picker-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
        .pick-count { margin-left: auto; font-size: 13px; }
        button.listening { background: var(--warn); border-color: var(--warn); color: #1a1405; }
        .pick-board { position: relative; container-type: inline-size; }
        button.pick-key { position: absolute; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted);
                          font-size: clamp(9px, 1.15cqw, 13px); line-height: 1; white-space: nowrap; overflow: hidden; }
        button.pick-key:hover { border-color: var(--muted); color: var(--text); }
        button.pick-key[aria-pressed="true"] { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
        button.pick-key.flash { outline: 2px solid var(--warn); outline-offset: 1px; }
        .pick-note { min-height: 1.55em; margin-top: 10px; }

        /* ---- the bars' own keys ---- */
        .lane-keys { margin: -4px 0 12px; }
        .lane-keys .row { margin-top: 8px; }
        .lane-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 40px; padding: 6px;
                      border: 1px dashed var(--line); border-radius: 8px; }
        .lane-chips.listening { border-color: var(--warn); cursor: crosshair; }
        .lane-chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 2px 2px 9px; border: 1px solid var(--line);
                     border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; }
        .lane-chip button { padding: 0 6px; background: none; color: var(--muted); font-size: 15px; line-height: 1.4; }
        .lane-chip button:hover { color: var(--text); }
        .lane-note { min-height: 1.55em; margin-top: 6px; }
        .panel > .box + .box { margin-top: 14px; }

        /* ---- two PCs ---- */
        .switch-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
        .switch-row.sub { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
        .switch-title { font-weight: 600; margin-bottom: 2px; }
        .switch-row p { font-size: 13px; }
        .switch { position: relative; flex-shrink: 0; width: 44px; height: 24px; margin-top: 2px; }
        .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
        .switch span { position: absolute; inset: 0; border-radius: 12px; background: #43464f; pointer-events: none; transition: background 0.15s; }
        .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
        .switch input:checked + span { background: var(--accent); }
        .switch input:checked + span::after { transform: translateX(20px); }
        .switch input:focus-visible + span { outline: 2px solid var(--link); outline-offset: 2px; }
        .switch input:disabled { cursor: default; }
        .switch input:disabled + span, .switch.busy span { opacity: 0.5; }
        .peer-list { list-style: none; margin: 12px 0 0; padding: 0; }
        .peer-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
        .peer-list button { flex-shrink: 0; white-space: nowrap; }
        #send-text { font-size: 13px; }

        @media (max-width: 760px) {
            .app { grid-template-columns: minmax(0, 1fr); }
            .sidebar { position: static; height: auto; padding: 14px 16px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
            .summary { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 0 0 12px; }
            nav { flex-direction: row; flex-wrap: wrap; }
            .nav-group { display: none; }
            nav a { padding: 6px 10px; }
            .language { margin-top: 8px; padding: 0; }
            main { padding: 20px 16px 40px; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="summary">
            <h1 class="brand">KbmOverlay<span class="muted" id="version"></span></h1>
            <span class="pill" id="status" role="status"><span class="dot"></span><span id="status-text" data-i18n="status.connecting"></span></span>
            <span class="pill ok" id="relay-pill" hidden><span class="dot"></span><span id="relay-pill-text"></span></span>
            <span class="muted last-input" id="last-input" data-i18n="input.hint"></span>
        </div>
        <nav>
            <div class="nav-group" data-i18n="nav.overlays"></div>
            <a href="#combo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="8" width="12" height="9" rx="1.5"/><path d="M4.5 11h.01M7.5 11h.01M10.5 11h.01M5 14h5"/><rect x="16" y="5.5" width="6.5" height="12" rx="3.25"/><path d="M19.25 8.5v2"/></svg>
                <span data-i18n="combo.title"></span>
            </a>
            <a href="#keyboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M8 14h8"/></svg>
                <span data-i18n="keyboard.title"></span>
            </a>
            <a href="#mouse">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="3" width="11" height="18" rx="5.5"/><path d="M12 7v3"/></svg>
                <span data-i18n="mouse.title"></span>
            </a>
            <a href="#mouse-move">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 12l4.5-4.5M13 7.5h3.5V11"/></svg>
                <span data-i18n="mouseMove.title"></span>
            </a>
            <a href="#counter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M7 16v-5M12 16V6M17 16V9"/></svg>
                <span data-i18n="counter.title"></span>
            </a>
            <a href="#history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.5"/><rect x="3.5" y="10.5" width="12" height="4.5" rx="1.5"/><rect x="3.5" y="16.5" width="8" height="3.5" rx="1.5"/></svg>
                <span data-i18n="history.title"></span>
            </a>
            <a href="#bars">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="16" width="6" height="4.5" rx="1"/><rect x="13.5" y="16" width="6" height="4.5" rx="1"/><path d="M7.5 13V5M16.5 13V9"/></svg>
                <span data-i18n="bars.title"></span>
            </a>
            <div class="nav-group" data-i18n="nav.more"></div>
            <a href="#relay">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="8" height="6.5" rx="1"/><rect x="13.5" y="4.5" width="8" height="6.5" rx="1"/><path d="M6.5 11v3.5h11V11M12 14.5V19M9 19h6"/></svg>
                <span data-i18n="relay.title"></span>
                <span class="badge" id="relay-badge" data-i18n-title="nav.attention" hidden></span>
            </a>
            <a href="#about">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
                <span data-i18n="about.title"></span>
            </a>
        </nav>
        <label class="language" data-i18n-title="language.label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
            </svg>
            <select id="language" data-i18n-aria="language.label"></select>
        </label>
    </aside>

    <main>
        <!-- Shown above every panel, so a request is never missed; screen readers read it out when it shows. -->
        <div class="banner" id="approval" role="alert" hidden>
            <p id="approval-text"></p>
            <p><span data-i18n="approval.code"></span> <span class="code" id="approval-code"></span></p>
            <p class="muted" data-i18n="approval.hint"></p>
            <div class="row">
                <button type="button" id="approve" data-i18n="approval.allow"></button>
                <button type="button" class="secondary" id="deny" data-i18n="approval.deny"></button>
            </div>
        </div>

        <div class="banner" id="waiting" role="status" hidden>
            <p id="waiting-text"></p>
            <p><span data-i18n="approval.code"></span> <span class="code" id="waiting-code"></span></p>
            <p class="muted" data-i18n="waiting.hint"></p>
        </div>

        <div class="notice closable" id="admin-notice" hidden>
            <span data-i18n="admin.notice"></span>
            <button type="button" class="close" id="admin-notice-close" data-i18n-title="admin.close" data-i18n-aria="admin.close">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
        </div>

        <!-- Files in the pages folder that hide this version's built-in ones (PageStore.StaleOverrides). -->
        <div class="notice closable" id="stale-notice" hidden>
            <div>
                <p id="stale-text" class="selectable"></p>
                <div class="row"><button type="button" class="secondary" id="stale-open" data-i18n="files.open"></button></div>
            </div>
            <button type="button" class="close" id="stale-close" data-i18n-title="admin.close" data-i18n-aria="admin.close">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
        </div>

        <section class="panel" data-panel="combo" data-page="combo.html" data-colors="pressed released glow line" hidden>
            <h2 data-i18n="combo.title"></h2>
            <p class="muted intro" data-i18n="combo.intro"></p>
            <div class="preview"><iframe data-i18n-title="preview.combo"></iframe></div>
            <!-- Shown when the layout is "Pick keys": combo.html?keys=... (its own keys, apart from the keyboard's) -->
            <div class="box picker" data-store="comboPickedKeys" hidden>
                <h3 data-i18n="picker.title"></h3>
                <p class="muted small" data-i18n="picker.intro"></p>
                <div class="picker-tools">
                    <button type="button" class="secondary pick-listen" aria-pressed="false" data-i18n="picker.listen"></button>
                    <button type="button" class="secondary" data-pick="wasd" data-i18n="picker.wasd"></button>
                    <button type="button" class="secondary" data-pick="all" data-i18n="picker.all"></button>
                    <button type="button" class="secondary" data-pick="none" data-i18n="picker.none"></button>
                    <span class="pick-count"></span>
                </div>
                <div class="pick-board" role="group" data-i18n-aria="picker.title"></div>
                <p class="pick-note small muted" aria-live="polite"></p>
            </div>
            <div class="columns">
                <div class="box">
                    <h3 data-i18n="box.options"></h3>
                    <label class="field"><span data-i18n="keyboard.layout"></span>
                        <select data-param="layout">
                            <option value="" data-i18n="layout.wasd"></option>
                            <option value="tkl" data-i18n="layout.tkl"></option>
                            <option value="full" data-i18n="layout.full"></option>
                            <option value="pick" data-i18n="layout.pick"></option>
                        </select>
                    </label>
                    <label class="field"><span data-i18n="combo.moveStyle"></span>

<script>
    Overlay.i18n().then(function (t) {
        'use strict';

        function $(id) { return document.getElementById(id); }

        function el(tag, className, text) {
            var element = document.createElement(tag);
            if (className) element.className = className;
            if (text != null) element.textContent = text;
            return element;
        }

        // ---- keys pressed to try an overlay ----
        // After a click, the clicked button, link or menu keeps the focus, and keys pressed to try an overlay
        // would act on it: Space or Enter press the button, letters and arrows change the menu, and the browser
        // draws the blue focus ring of keyboard use around it. So after a click, the first such key only lets go
        // of the focus. Tab brings the keyboard way back (focus rings, keys acting on menus); fields still type.
        // Even then, letters and Space do not change a menu (a <select> jumps to the option starting with the
        // letter: Z picked "Z X + ..." on the bars).
        var root = document.documentElement;
        document.addEventListener('mousedown', function () { root.classList.add('mouse-used'); }, true);
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Tab') {
                root.classList.remove('mouse-used');
                return;
            }
            if (event.ctrlKey || event.altKey || event.metaKey) return; // browser shortcuts stay
            var focused = document.activeElement;
            if (!focused || focused === document.body || focused.matches('input, textarea')) return;
            var acts = event.key.length === 1 || /^(Enter|Arrow|Home$|End$|Page)/.test(event.key);
            if (root.classList.contains('mouse-used')) {
                focused.blur();
                if (acts) event.preventDefault();
            } else if (focused.tagName === 'SELECT' && event.key.length === 1) {
                event.preventDefault();
            }
        }, true);

        var info = t.info;
        Overlay.translate(t, document);
        document.title = info.version ? t('page.titleVersion', { version: info.version }) : t('page.title');
        if (info.version) {
            $('version').textContent = info.version;
            $('about-version').textContent = t('about.version', { version: info.version });
            $('about-version').hidden = false;
        }

        // ---- choices remembered in this browser (panel, options, colors, last copied URLs) ----

        var store = (function () {
            var KEY = 'kbmoverlay.settings';
            var data = {};
            try {
                var saved = JSON.parse(localStorage.getItem(KEY));
                if (saved && typeof saved === 'object') data = saved;
            } catch (e) {
                // Storage off or broken: start from the defaults.
            }
            return {

        var PRESETS = [

            { name: 'blue', pressed: '1F6FEB', released: '58A6FF', glow: '9ED0FF' },
            { name: 'red', pressed: 'D63B3B', released: 'FF7B5C', glow: 'FFB347' },
            { name: 'purple', pressed: '7C4DFF', released: 'B39DFF', glow: 'FF6EC7' },
            { name: 'orange', pressed: 'E67E22', released: 'FFB65C', glow: 'FFE08A' },
            { name: 'pink', pressed: 'E0559A', released: 'FF9CCB', glow: 'B39DFF' }

        function isHex(value) { return typeof value === 'string' && /^[0-9A-Fa-f]{6}$/.test(value); }

        var savedColors = store.object('colors');
        COLOR_NAMES.forEach(function (name) {
            if (isHex(savedColors[name])) colors[name] = savedColors[name].toUpperCase();
        });

        function colorOf(name) { return colors[name] || defaults[name]; }

        // changes: { name: 'RRGGBB' or null for the theme.css color }
        function setColors(changes) {
            Object.keys(changes).forEach(function (name) {

                else colors[name] = value;

        function cssToHex(value) {

            var probe = document.createElement('span');
            probe.style.color = value;

            document.body.appendChild(probe);

        // ---- look (fade time, glow size, key corners, shown while not pressed) ----

        var lookDefaults = { '--key-release-time': 0.5, '--mouse-release-time': 0.25, '--glow-size': 1, '--key-radius': 10, '--idle-opacity': 1 }; // until theme.css is read

        function formatLook(format, value) {
            if (format === 'px') return t('unit.px', { value: value });
            if (value === 0) return t(format === 'opacity' ? 'look.hidden' : 'look.off');
            if (format === 'percent' || format === 'opacity') return t('unit.percent', { value: Math.round(value * 100) });
            return t('unit.seconds', { value: value });
        }

        // Turns <div class="slider" data-slider="fade" data-var="--key-release-time" ...> into a label, a value,
        // a reset link and a range input with data-param, which then works like the other options.
        function buildSlider(div) {
            var label = t(div.getAttribute('data-label'));
            var head = el('div', 'slider-head');
            var value = el('span', 'slider-value');
            var reset = el('button', 'link', t('look.reset'));
            reset.type = 'button';

            });

        // Show the colors and look the overlays really have: theme.css, then custom.css from the pages folder.

        }))
            .then(function (files) {
                files.forEach(function (css) {
                    var root = /:root\s*\{([^}]*)\}/.exec(css.replace(/\/\*[\s\S]*?\*\//g, '')); // lines commented out do not count
                    if (!root) return;

                        var match = new RegExp(name + '\\s*:\\s*([^;]+);').exec(root[1]);

        // Fills the Colors box of one panel: preset swatches (when the overlay has a pressed color)

        function colorBox(box, names) {

        // ---- picking keys by hand (keyboard.html?keys=KeyW,KeyA,...) ----

        // Fills the picker box. onChange runs whenever the picked keys change. The keys are remembered under

            var count = box.querySelector('.pick-count');
            var listenButton = box.querySelector('.pick-listen');

            function changed() {

            function setNote(text, tone) {

            fetch('layouts/full.json')
                .then(function (response) { return response.json(); })
                .then(function (layout) {
                    var all = Overlay.layoutKeys(layout);
                    var right = 0, bottom = 0;
                    all.forEach(function (key) {
                        right = Math.max(right, key.x + key.w);
                        bottom = Math.max(bottom, key.y + key.h);

                        button.title = key.name;
                        button.style.left = 'calc(' + (key.x / right * 100) + '% + 1.5px)';
                        button.style.top = 'calc(' + (key.y / bottom * 100) + '% + 1.5px)';
                        button.style.width = 'calc(' + (key.w / right * 100) + '% - 3px)';
                        button.style.height = 'calc(' + (key.h / bottom * 100) + '% - 3px)';

            var note = box.querySelector('.lane-note');
            var keys = [];
            var listening = false;
            var added = false;      // keys were added since "Add by pressing" was turned on
            var fromList = false;   // the change event below comes from the list, not from the menu

                .then(function (response) { return response.json(); })
                .then(function (layout) {

        // ---- preview background ----

            previewBg = color;
            store.set('previewBg', color);
            previewBgRenders.forEach(function (render) { render(); });
        }

        // Puts the swatches and a color picker at the top right of one preview and returns them.
        function previewBgPicker(preview) {
            var group = el('div', 'preview-bg');
            group.setAttribute('role', 'group');
            group.setAttribute('aria-label', t('previewBg.label'));
            var swatches = PREVIEW_BACKGROUNDS.map(function (choice) {
                var button = el('button', choice.color ? 'bg-swatch' : 'bg-swatch checker');
                button.type = 'button';
                if (choice.color) button.style.background = choice.color;
                button.title = t(choice.name);
                button.setAttribute('aria-label', button.title);
                button.addEventListener('click', function () { setPreviewBg(choice.color); });
                group.appendChild(button);
                return { button: button, color: choice.color };
            });
            var pick = el('label', 'bg-swatch pick');
            pick.title = t('previewBg.pick');
            var input = el('input');
            input.type = 'color';
            input.setAttribute('aria-label', pick.title);
            input.addEventListener('input', function () { setPreviewBg(input.value.toUpperCase()); });
            pick.appendChild(input);
            group.appendChild(pick);
            preview.appendChild(group);

            previewBgRenders.push(function () {
                var custom = previewBg !== '' && !PREVIEW_BACKGROUNDS.some(function (choice) { return choice.color === previewBg; });
                preview.style.background = previewBg; // '' brings back the checkerboard
                swatches.forEach(function (swatch) { swatch.button.setAttribute('aria-pressed', String(swatch.color === previewBg)); });
                pick.classList.toggle('selected', custom);
                pick.style.background = custom ? previewBg : '';
                if (custom) input.value = previewBg.toLowerCase();
            });
            previewBgRenders[previewBgRenders.length - 1]();
            return group;
        }

        // ---- overlay panels ----

        var PREVIEW_PAD = 16;         // px around the overlay inside the preview
        var PREVIEW_MAX_HEIGHT = 320; // px; taller overlays are shown smaller

        var cards = [];
        var savedOptions = store.object('options');
        var copied = store.object('copied');   // page -> URL last copied, to notice later changes

        function refreshCards() {
            cards.forEach(function (card) { card.refresh(); });
        }

        function setupCard(card) {
            var page = card.getAttribute('data-page');
            var colorNames = (card.getAttribute('data-colors') || '').split(' ').filter(Boolean);
            var iframe = card.querySelector('iframe');
            var preview = card.querySelector('.preview');
            var bgPicker = previewBgPicker(preview);
            var obsBox = card.querySelector('.obs');
            obsBox.appendChild(document.importNode($('obs-box').content, true));
            Overlay.translate(t, obsBox);
            var urlInput = obsBox.querySelector('.url');
            var copyButton = obsBox.querySelector('.copy');
            var changedNote = obsBox.querySelector('.changed');
            var sizeText = obsBox.querySelector('.size');
            obsBox.querySelector('.howto').open = !Object.keys(copied).length; // open until something was copied once
            Array.prototype.forEach.call(card.querySelectorAll('[data-slider]'), buildSlider);
            var controls = Array.prototype.slice.call(card.querySelectorAll('[data-param]'));
            var sliders = controls.filter(function (control) { return control.type === 'range'; });
            var renderColors = colorBox(card.querySelector('.colors'), colorNames);
            var layoutSelect = card.querySelector('[data-param="layout"]');
            var pickerBox = card.querySelector('.picker');
            var picker = pickerBox ? keyPicker(pickerBox, function () { update(); }) : null;
            var size = null;

            // What a control adds to the URL; '' adds nothing.
            function paramValue(control) {
                if (control.paramValue) return control.paramValue();
                return control === layoutSelect && picking() ? '' : control.value.trim();
            }

            function picking() {
                return !!picker && layoutSelect.value === 'pick';
            }

            // A number outside the field's range is put back inside it: the overlay would use it that way
            // anyway, and the URL should say what the overlay shows.
            function clampNumber(control) {
                if (control.type !== 'number' || control.value === '') return;
                var value = Math.min(+control.max, Math.max(+control.min, +control.value));
                if (value !== +control.value) control.value = value;
            }

            var options = savedOptions[page] || {};
            controls.forEach(function (control) {
                var value = options[control.getAttribute('data-param')];
                if (typeof value !== 'string') return;
                if (control.setPicked) {
                    control.setPicked(value);
                    return;
                }
                control.value = value;
                if (control.tagName === 'SELECT' && control.selectedIndex < 0) control.selectedIndex = 0;
                clampNumber(control);
            });
            sliders.forEach(function (slider) { slider.render(); });
            if (picker) picker.show(picking());

            function url() {
                var parts = [];
                controls.forEach(function (control) {
                    var value = paramValue(control);
                    if (value !== '') parts.push(control.getAttribute('data-param') + '=' + encodeURIComponent(value));
                });
                if (picking()) parts.push('keys=' + picker.keys().join(','));
                colorNames.forEach(function (name) {
                    if (colors[name]) parts.push(name + '=' + colors[name]);
                });
                return location.origin + '/' + page + (parts.length ? '?' + parts.join('&') : '');
            }

            // Centers the overlay in the preview, shrunk to fit when it is too big, and below the
            // background picker when it would reach under it.
            function fit() {
                var width = preview.clientWidth;
                if (!size || !width) return; // not measured yet, or the panel is hidden
                if (!size[0] || !size[1]) {
                    // Pages that measure themselves (mouse, counter) get 0 while their panel is hidden:
                    // load the preview again now that it shows.
                    size = null;
                    sizeText.textContent = t('size.measuring');
                    iframe.contentWindow.location.reload();
                    return;
                }
                var scale = Math.min(1, (width - PREVIEW_PAD * 2) / size[0], PREVIEW_MAX_HEIGHT / size[1]);
                var shownWidth = size[0] * scale, shownHeight = size[1] * scale;
                var left = Math.round((width - shownWidth) / 2);
                var under = left + shownWidth > bgPicker.offsetLeft - 8;
                var above = under ? bgPicker.offsetTop + bgPicker.offsetHeight + 8 : PREVIEW_PAD;
                var height = Math.max(140, Math.ceil(shownHeight) + above + PREVIEW_PAD);
                var top = above + Math.round((height - above - PREVIEW_PAD - shownHeight) / 2);
                iframe.style.width = size[0] + 'px';
                iframe.style.height = size[1] + 'px';
                iframe.style.transform = 'translate(' + left + 'px, ' + top + 'px) scale(' + scale + ')';
                preview.style.height = height + 'px';
            }

            function update() {
                var value = url();
                urlInput.value = value;
                changedNote.hidden = !copied[page] || copied[page] === value;
                if (iframe.getAttribute('src') !== value) {
                    sizeText.textContent = t('size.measuring');
                    iframe.src = value;
                }
            }

            controls.forEach(function (control) {
                control.addEventListener('change', function () {
                    clampNumber(control);
                    var values = {};
                    controls.forEach(function (c) { values[c.getAttribute('data-param')] = c.paramValue ? c.paramValue() : c.value.trim(); });
                    savedOptions[page] = values;
                    store.set('options', savedOptions);
                    if (control === layoutSelect && picker) {
                        picker.show(picking());
                        if (picking()) pickerBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    update();
                });
            });

            copyButton.addEventListener('click', function () {
                function flash(text) {
                    copyButton.textContent = text;
                    setTimeout(function () { copyButton.textContent = t('copy'); }, 1500);
                }
                function done() {
                    copied[page] = urlInput.value;
                    store.set('copied', copied);
                    changedNote.hidden = true;
                    flash(t('copied'));
                }
                // The URL stays selected, so Ctrl+C copies it when the browser would not.
                function fallback() {
                    urlInput.select();
                    var ok = false;
                    try { ok = document.execCommand('copy'); } catch (e) { /* not allowed here */ }
                    if (ok) done(); else flash(t('copyFailed'));
                }
                if (navigator.clipboard) navigator.clipboard.writeText(urlInput.value).then(done, fallback);
                else fallback();
            });

            window.addEventListener('message', function (event) {
                if (event.origin !== location.origin || event.source !== iframe.contentWindow) return;
                if (!event.data || !event.data.kbmOverlaySize) return;
                size = event.data.kbmOverlaySize;
                sizeText.innerHTML = t.html('size.text', { width: size[0], height: size[1] });
                fit();
            });
            window.addEventListener('resize', fit);

            cards.push({
                fit: fit,
                refresh: function () {
                    renderColors();
                    sliders.forEach(function (slider) { slider.render(); });
                    update();
                }
            });
            renderColors();
            update();
        }

        Array.prototype.forEach.call(document.querySelectorAll('[data-page]'), setupCard);

        // ---- menu ----
        // The address ends in #keyboard, #relay, ... No element has those ids, so the page does not jump.

        var panels = Array.prototype.slice.call(document.querySelectorAll('[data-panel]'));
        var links = Array.prototype.slice.call(document.querySelectorAll('nav a'));

        // Someone new starts on the combined overlay: copy, paste into OBS, done.
        function showPanel(name) {
            var known = panels.some(function (panel) { return panel.getAttribute('data-panel') === name; });
            if (!known) name = 'combo';
            panels.forEach(function (panel) { panel.hidden = panel.getAttribute('data-panel') !== name; });
            links.forEach(function (link) {
                if (link.getAttribute('href') === '#' + name) link.setAttribute('aria-current', 'page');
                else link.removeAttribute('aria-current');
            });
            store.set('panel', name);
            cards.forEach(function (card) { card.fit(); });
        }

        window.addEventListener('hashchange', function () {
            showPanel(location.hash.slice(1));
            window.scrollTo(0, 0);
        });
        showPanel(location.hash.slice(1) || store.get('panel'));

        // ---- connection ----

        var status = $('status');
        var connection = Overlay.connect(['key', 'button', 'relay'])
            .on('status', function (connected) {
                status.classList.toggle('ok', connected);
                $('status-text').textContent = t(connected ? 'status.connected' : 'status.off');
                if (!connected) renderRelay(null);
            })
            .on('key', function (name, down) {
                if (down) $('last-input').textContent = t('input.key', { name: name });
                keyListeners.forEach(function (listener) { listener(name, down); });
            })
            .on('button', function (name, down) {
                if (down) $('last-input').textContent = t('input.button', { name: t('button.' + name) });
            })
            .on('relay', renderRelay)
            .on('relayError', function (message) {
                $('manual-error').textContent = message;
                $('manual-error').hidden = false;
            })
            .on('exported', function (result) {
                var text = $('files-result');
                text.hidden = false;
                if (result.error) setText(text, t('files.failed', { error: result.error, dir: result.dir }), 'small bad selectable');
                else setText(text, t(result.count ? 'files.copied' : 'files.opened', { count: result.count, dir: result.dir }), 'small good selectable');
            });

        $('open-pages').addEventListener('click', function () { connection.send({ cmd: 'exportPages' }); });
        $('stale-open').addEventListener('click', function () { connection.send({ cmd: 'exportPages' }); });

        // ---- About > Reset all settings ----
        // Forgets the choices this browser remembers (options, colors, picked keys, preview background, closed
        // notices, last panel) and sets the language back to automatic. Two-PC settings stay, and sources
        // already in OBS keep their URLs.
        // The clicked button hides, so the focus moves to the next question instead of getting lost.
        $('reset-all').addEventListener('click', function () {
            $('reset-ask').hidden = true;
            $('reset-confirm').hidden = false;
            $('reset-no').focus();
        });
        $('reset-no').addEventListener('click', function () {
            $('reset-confirm').hidden = true;
            $('reset-ask').hidden = false;
            $('reset-all').focus();
        });
        $('reset-yes').addEventListener('click', function () {
            history.replaceState(null, '', location.pathname); // no #panel, and no hashchange saving it again
            store.clear();
            if (info.langSetting && info.langSetting !== 'auto') setLanguage('auto');
            else location.reload();
        });

        // Tells KbmOverlay and reloads the page once info.json says the language is in use (or after 3 s,
        // e.g. while not connected), so the page never comes back in the old language.
        function setLanguage(lang) {
            connection.send({ cmd: 'language', lang: lang });
            var tries = 0;
            (function check() {
                fetch('info.json', { cache: 'no-store' })
                    .then(function (response) { return response.json(); })
                    .then(function (now) { return now.langSetting === lang; }, function () { return false; })
                    .then(function (done) {
                        if (done || ++tries >= 30) location.reload();
                        else setTimeout(check, 100);
                    });
            })();
        }

        languageSelect.addEventListener('change', function () { setLanguage(languageSelect.value); });

        // ---- two PCs ----

        function setText(element, text, tone) {
            element.textContent = text;
            element.className = tone || 'muted';
        }

        function peerItem(label, buttonText, buttonClass, onClick) {
            var li = document.createElement('li');
            var span = document.createElement('span');
            span.textContent = label;
            li.appendChild(span);
            if (buttonText) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = buttonClass || '';
                button.textContent = buttonText;
                if (onClick) button.addEventListener('click', onClick); else button.disabled = true;
                li.appendChild(button);
            }
            return li;
        }

        // Text (or markup) that only changes when it really differs: a status report comes often, and the
        // banners are read out by screen readers on every change.
        function fillOnce(element, value, html) {
            if (element.filledWith === value) return;
            element.filledWith = value;
            if (html) element.innerHTML = value; else element.textContent = value;
        }

        var lastRelay = null;

        function renderRelay(relay) {
            lastRelay = relay;
            var receive = relay ? relay.receive : null;
            var send = relay ? relay.send : null;

            $('relay-machine').textContent = relay ? relay.machine : '…';
            $('relay-addresses').textContent = relay && relay.addresses.length ? '(' + relay.addresses.join(', ') + ')' : '';

            // Approval prompt (streaming PC). Filled before it shows, so a screen reader reads the whole request.
            var pending = receive && receive.pending;
            if (pending) {
                fillOnce($('approval-text'), t.html('approval.text', { name: pending.name, address: pending.address }), true);
                fillOnce($('approval-code'), pending.code);
            }
            $('approval').hidden = !pending;

            // Waiting for approval (game PC).
            var waiting = send && send.state === 'waiting';
            if (waiting) {
                fillOnce($('waiting-text'), t.html('waiting.text', { name: send.target }), true);
                fillOnce($('waiting-code'), send.code);
            }
            $('waiting').hidden = !waiting;

            var attention = (pending ? 1 : 0) + (waiting ? 1 : 0);
            $('relay-badge').hidden = !attention;
            $('relay-badge').textContent = attention;

            // Pill in the menu.
            var pillText = '';
            if (receive && receive.active) pillText = t('pill.showing', { name: receive.active.name });
            else if (send && send.state === 'sending') pillText = t('pill.sending', { name: send.target });
            $('relay-pill').hidden = !pillText;
            $('relay-pill-text').textContent = pillText;

            renderReceive(receive);
            renderSend(send);
        }

        function renderReceive(receive) {
            var text = $('receive-text');
            var receiveSwitch = $('receive-switch');
            var publicSwitch = $('public-switch');
            var onPublic = !!(receive && receive.on && receive.problem === 'public-network');
            var firewallProblem = !!(receive && (receive.problem === 'firewall-needed' || receive.problem === 'firewall-failed'));

            // The switches always show what KbmOverlay reports, not what was just clicked.
            receiveSwitch.parentNode.classList.remove('busy');
            publicSwitch.parentNode.classList.remove('busy');
            receiveSwitch.disabled = publicSwitch.disabled = !receive;
            receiveSwitch.checked = !!(receive && receive.on);
            publicSwitch.checked = !!(receive && receive.allowPublic);
            $('firewall-row').hidden = !(receive && receive.on && firewallProblem);
            $('public-row').hidden = !(receive && receive.on && (onPublic || receive.allowPublic));
            $('network-row').hidden = !onPublic;
            if (!receive) {
                setText(text, t('receive.notConnected'));
                return;
            }
            $('public-text').textContent = t('receive.publicSwitchText', { port: receive.port });

            if (!receive.on) setText(text, t('receive.offText'));
            else if (receive.problem === 'public-network') setText(text, t('receive.publicText', { port: receive.port }), 'warn');
            else if (receive.problem === 'firewall-needed') setText(text, t('receive.firewallNeededText'), 'warn');
            else if (receive.problem === 'firewall-failed') setText(text, t('receive.firewallFailedText'), 'bad');
            else if (receive.problem === 'port-in-use') setText(text, t('receive.portInUseText', { port: receive.port }), 'bad');
            else if (!receive.listening) setText(text, t('receive.starting'));
            else if (receive.active) setText(text, t('receive.activeText', { name: receive.active.name, address: receive.active.address }), 'good');
            else setText(text, t('receive.waitingText'));

            var list = $('paired-list');
            list.innerHTML = '';
            receive.paired.forEach(function (peer) {
                list.appendChild(peerItem(t('receive.paired', { name: peer.name }), t('receive.remove'), 'danger', function () {
                    if (confirm(t('receive.removeConfirm', { name: peer.name }))) connection.send({ cmd: 'forget', id: peer.id });
                }));
            });
        }

        function renderSend(send) {
            var text = $('send-text');
            var list = $('found-list');
            list.innerHTML = '';
            $('stop-sending').hidden = !(send && (send.receiver || ['connecting', 'waiting', 'retrying', 'sending', 'searching'].indexOf(send.state) >= 0));
            if (!send) {
                setText(text, t('receive.notConnected'));
                return;
            }

            var vars = { name: send.target || (send.receiver && send.receiver.name) || '' };
            switch (send.state) {
                case 'sending': setText(text, t('send.sendingText', vars), 'good'); break;
                case 'waiting': setText(text, t('send.waitingText', vars), 'warn'); break;
                case 'connecting': setText(text, t('send.connectingText', vars)); break;
                case 'searching': setText(text, t('send.searchingText', vars)); break;
                case 'retrying': setText(text, send.message || t('send.retryingText', vars), 'warn'); break;
                case 'denied': setText(text, t('send.deniedText'), 'bad'); break;
                case 'forgotten': setText(text, send.message || t('send.forgottenText'), 'warn'); break;
                default:
                    if (lastRelay && lastRelay.receive.on && !send.found.length) setText(text, t('send.isStreamingText'));
                    else setText(text, t(send.found.length ? 'send.foundText' : 'send.searchText'));
            }

            send.found.forEach(function (f) {
                var isTarget = send.receiver && send.receiver.id === f.id && send.state !== 'forgotten';
                var label = f.name + ' (' + f.address + ')';
                if (isTarget) list.appendChild(peerItem(label, t(send.state === 'sending' ? 'send.sendingBadge' : 'send.targetBadge'), 'secondary', null));
                else list.appendChild(peerItem(label, t('send.send'), '', function () { connection.send({ cmd: 'send', id: f.id }); }));
            });
        }

        // A switch sends its command and stays dimmed until KbmOverlay reports the new state
        // (right away; the firewall prompt comes after). If no report comes, it goes back.
        function onSwitch(input, command) {
            input.addEventListener('change', function () {
                input.parentNode.classList.add('busy');
                connection.send(command(input.checked));
                setTimeout(function () { renderRelay(lastRelay); }, 3000);
            });
        }
        onSwitch($('receive-switch'), function (on) { return { cmd: 'receive', on: on }; });
        onSwitch($('public-switch'), function (on) { return { cmd: 'allowPublic', on: on }; });

        $('firewall-retry').addEventListener('click', function () { connection.send({ cmd: 'receive', on: true }); });
        $('network-settings').addEventListener('click', function () { connection.send({ cmd: 'networkSettings' }); });
        $('approve').addEventListener('click', function () { connection.send({ cmd: 'approve', id: lastRelay.receive.pending.id }); });
        $('deny').addEventListener('click', function () { connection.send({ cmd: 'deny', id: lastRelay.receive.pending.id }); });
        $('search').addEventListener('click', function () { connection.send({ cmd: 'search' }); });
        $('stop-sending').addEventListener('click', function () { connection.send({ cmd: 'stopSending' }); });
        $('manual-connect').addEventListener('click', function () {
            $('manual-error').hidden = true;
            connection.send({ cmd: 'sendTo', address: $('manual-address').value });
        });
        $('manual-address').addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.isComposing) $('manual-connect').click();
        });
    }).catch(function (error) {
        // A mistake above (or in a changed copy of this page) would otherwise leave a half-filled page without a word.
        console.error(error);
        Overlay.i18n().then(function (t) {
            var notice = document.createElement('div');
            notice.className = 'notice selectable';
            notice.setAttribute('role', 'alert');
            notice.textContent = t('page.failed', { error: (error && error.message) || String(error) });
            var main = document.querySelector('main');
            main.insertBefore(notice, main.firstChild);
        });
    });
</script>
</body>
</html>
