<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Keyboard</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="custom.css"> <!-- your own look, last so it wins (see custom.css) -->
    <script src="overlay.js"></script>
    <script src="keyboard.js"></script>
</head>
<body>
    <div class="board" id="board"></div>
    <script>
        // keyboard.html?layout=wasd|tkl|full&keys=...&presses=heat|count|both&reset=60 (see keyboard.js)&scale=1.5
        (function () {
            'use strict';

            var board = document.getElementById('board');
            Overlay.keyboard(board).then(function (keyboard) {
                var scale = Overlay.number('scale', 1, 0.25, 4);
                board.style.transform = 'scale(' + scale + ')';
                Overlay.reportSize(keyboard.width * scale, keyboard.height * scale);
                Overlay.connect(['key']).on('key', keyboard.key);
            }, function (error) {
                Overlay.showError(error.message);
            });
        })();
    </script>
</body>
</html>
