<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mouse movement</title>
    <link rel="stylesheet" href="theme.css">
    <script src="overlay.js"></script>
    <script src="mouse-move.js"></script>
    <style>
        #moves { position: relative; }
    </style>
    <link rel="stylesheet" href="custom.css"> <!-- your own look, last so it wins (see custom.css) -->
</head>
<body>
    <div id="moves"></div>
    <script>
        // mouse-move.html?size=400&sens=1&style=ring|arrow|trail (see mouse-move.js)
        (function () {
            'use strict';

            var size = Math.round(Overlay.number('size', 400, 120, 2000)); // page width and height in px
            var moves = Overlay.mouseMove(document.getElementById('moves'), size);
            Overlay.reportSize(moves.width, moves.height);
            Overlay.connect(['move']).on('move', moves.move);
        })();
    </script>
</body>
</html>
