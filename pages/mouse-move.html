<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mouse movement</title>
    <link rel="stylesheet" href="theme.css">
    <script src="overlay.js"></script>
    <style>
        body { position: relative; }
        .segment {
            position: absolute;
            box-sizing: border-box;
            border-radius: 50%;
            border: 2px solid var(--line);
            opacity: 0;
        }
    </style>
    <link rel="stylesheet" href="custom.css"> <!-- your own look, last so it wins (see custom.css) -->
</head>
<body>
    <script>
        // mouse-move.html?size=400&sens=1&style=ring|arrow|trail
        //   ring (default): a ring that lights up in the direction the mouse moves; faster is brighter and redder.
        //   arrow: an arrow from the center in the direction the mouse moves; faster is longer and redder.
        //   trail: the path of the last moment, running back from the center and fading out.
        // The ring's animation and the color table follow mouse-movement.html from Zergatul.Obs.InputOverlay (MIT).
        (function () {
            'use strict';

            var SIZE = Math.round(Overlay.number('size', 400, 120, 2000)); // page width and height in px
            var SENSITIVITY = Overlay.number('sens', 1, 0.05, 20);          // raise for low DPI mice
            var STYLE = ['arrow', 'trail'].indexOf(Overlay.params.get('style')) >= 0 ? Overlay.params.get('style') : 'ring';
            var STALE = 250;              // ms; a longer gap between frames means the page was not drawn (hidden
                                          // preview, OBS source in another scene), so the movement meanwhile is dropped
            var COUNT = 30;               // segments in the ring
            var FADE = 1.005;             // brightness is divided by this every millisecond
            var SPEED_FACTOR = 0.00001;   // counts per second -> brightness
            var NEIGHBOURS = 1;           // segments on each side that also light up
            var NEIGHBOUR_FALLOFF = 2;
            var FULL_SPEED = 8000;        // counts per second drawn longest and reddest by the arrow and the trail
                                          // (at sens=1; about where the ring stays fully lit)
            var SMOOTHING = 80;           // ms; the arrow follows the speed this smoothly
            var TRAIL_TIME = 400;         // ms of movement the trail shows

            // Brightness 0..1 -> color. The first row must have opacity 0 (not moving = invisible).
            var GRADIENT = [
                { r: 45, g: 100, b: 38, a: 0.0, at: 0.0 },
                { r: 45, g: 100, b: 38, a: 1.0, at: 0.3 },
                { r: 255, g: 225, b: 61, a: 1.0, at: 0.5 },
                { r: 255, g: 61, b: 61, a: 1.0, at: 0.8 },
                { r: 255, g: 61, b: 61, a: 1.0, at: 1.0 }
            ];

            var segmentWidth = Math.round(SIZE * 0.066);
            var segmentHeight = Math.round(segmentWidth / 2);
            var radius = SIZE / 2 - segmentWidth / 2 - 6;
            var segments = [];
            var colors = [], opacities = [];
            var pendingX = 0, pendingY = 0;

            function buildRing() {
                for (var i = 0; i < COUNT; i++) {
                    var angle = 2 * Math.PI * i / COUNT;
                    var div = document.createElement('div');
                    div.className = 'segment';
                    div.style.width = segmentWidth + 'px';
                    div.style.height = segmentHeight + 'px';
                    div.style.left = (SIZE / 2 + Math.cos(angle) * radius - segmentWidth / 2).toFixed(2) + 'px';
                    div.style.top = (SIZE / 2 + Math.sin(angle) * radius - segmentHeight / 2).toFixed(2) + 'px';
                    div.style.transform = 'rotate(' + (90 + 360 * i / COUNT).toFixed(2) + 'deg)';
                    document.body.appendChild(div);
                    segments.push({ div: div, value: 0, changed: false });
                }
            }

            function buildColors() {
                function hex(v) {
                    v = Math.max(0, Math.min(255, v));
                    return (v < 16 ? '0' : '') + v.toString(16);
                }
                var row = 0;
                for (var i = 0; i <= 1000; i++) {
                    var t = i / 1000;
                    while (row < GRADIENT.length - 2 && t > GRADIENT[row + 1].at) row++;
                    var a = GRADIENT[row], b = GRADIENT[row + 1];
                    var f = b.at === a.at ? 0 : Math.min(1, Math.max(0, (t - a.at) / (b.at - a.at)));
                    colors[i] = '#' + hex(Math.round(a.r + (b.r - a.r) * f)) +
                        hex(Math.round(a.g + (b.g - a.g) * f)) + hex(Math.round(a.b + (b.b - a.b) * f));
                    opacities[i] = Math.round((a.a + (b.a - a.a) * f) * 1000) / 1000;
                }
            }

            function segment(index) {
                return segments[((index % COUNT) + COUNT) % COUNT];
            }

            function brighten(s, amount) {
                s.value = Math.min(1, s.value + amount);
                s.changed = true;
            }

            // dx, dy: raw counts since the last frame, dt ms ago. Each draw function returns whether
            // anything is still shown, which keeps the frames coming.
            function drawRing(dx, dy, dt) {
                var fade = Math.pow(FADE, dt);
                segments.forEach(function (s) {
                    if (s.value > 0) {
                        s.value = s.value / fade;
                        if (s.value < 0.001) s.value = 0;
                        s.changed = true;
                    }
                });

                if (dx !== 0 || dy !== 0) {
                    var index = Math.round(Math.atan2(dy, dx) / (2 * Math.PI / COUNT));
                    var speed = 1000 * Math.sqrt(dx * dx + dy * dy) / dt;
                    var amount = Math.min(1, speed * SPEED_FACTOR * SENSITIVITY);
                    brighten(segment(index), amount);
                    var falloff = NEIGHBOUR_FALLOFF;
                    for (var n = 1; n <= NEIGHBOURS; n++) {
                        brighten(segment(index - n), amount / falloff);
                        brighten(segment(index + n), amount / falloff);
                        falloff *= NEIGHBOUR_FALLOFF;
                    }
                }

                var lit = false;
                segments.forEach(function (s) {
                    if (s.value > 0) lit = true;
                    if (!s.changed) return;
                    var i = Math.round(s.value * 1000);
                    s.div.style.backgroundColor = colors[i];
                    s.div.style.opacity = opacities[i];
                    s.changed = false;
                });
                return lit;
            }

            // ---- arrow and trail: drawn on a canvas, centered, colored by the same table as the ring ----

            var ctx = null;
            var drawn = false; // something is on the canvas
            var R = SIZE / 2 - 8; // px from the center that the drawing stays within

            function buildCanvas() {
                var canvas = document.createElement('canvas');
                var ratio = window.devicePixelRatio || 1;
                canvas.width = Math.round(SIZE * ratio);
                canvas.height = Math.round(SIZE * ratio);
                canvas.style.width = canvas.style.height = SIZE + 'px';
                canvas.style.display = 'block';
                document.body.appendChild(canvas);
                ctx = canvas.getContext('2d');
                ctx.scale(ratio, ratio);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }

            // Speed in counts per ms -> 0..1, 1 at FULL_SPEED.
            function level(countsPerMs) {
                return Math.min(1, countsPerMs * 1000 / FULL_SPEED * SENSITIVITY);
            }

            function clear() {
                if (drawn) ctx.clearRect(0, 0, SIZE, SIZE);
                drawn = false;
            }

            var vx = 0, vy = 0; // smoothed speed, counts per ms
            function drawArrow(dx, dy, dt) {
                var k = 1 - Math.exp(-dt / SMOOTHING);
                vx += (dx / dt - vx) * k;
                vy += (dy / dt - vy) * k;
                var amount = level(Math.sqrt(vx * vx + vy * vy));
                clear();
                if (amount < 0.002) {
                    vx = vy = 0;
                    return false;
                }
                var i = Math.round(amount * 1000);
                var width = Math.max(3, SIZE * 0.035);
                var length = (R - width) * amount;
                var head = Math.min(width * 2.4, length);
                ctx.save();
                ctx.translate(SIZE / 2, SIZE / 2);
                ctx.rotate(Math.atan2(vy, vx));
                ctx.globalAlpha = opacities[i];
                ctx.strokeStyle = ctx.fillStyle = colors[i];
                ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.max(0, length - head), 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(length, 0);
                ctx.lineTo(length - head, -head * 0.8);
                ctx.lineTo(length - head, head * 0.8);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                drawn = true;
                return true;
            }

            var moves = []; // movement of the last TRAIL_TIME ms: { dx, dy, at, level }
            function drawTrail(dx, dy, dt, now) {
                if (dx !== 0 || dy !== 0) moves.push({ dx: dx, dy: dy, at: now, level: level(Math.sqrt(dx * dx + dy * dy) / dt) });
                while (moves.length && now - moves[0].at > TRAIL_TIME) moves.shift();
                clear();
                if (!moves.length) return false;

                // The newest point stays in the center and the path runs back from it, shrunk to fit when long.
                // Moving at half of FULL_SPEED for the whole TRAIL_TIME just reaches the edge.
                var scale = R / (FULL_SPEED / 2 * TRAIL_TIME / 1000) * SENSITIVITY; // px per count
                var path = [{ x: 0, y: 0 }];
                var x = 0, y = 0, far = 0;
                for (var m = moves.length - 1; m >= 0; m--) {
                    x -= moves[m].dx * scale;
                    y -= moves[m].dy * scale;
                    path.push({ x: x, y: y });
                    far = Math.max(far, Math.sqrt(x * x + y * y));
                }
                var fit = far > R ? R / far : 1;
                var width = Math.max(3, SIZE * 0.03);

                ctx.save();
                ctx.translate(SIZE / 2, SIZE / 2);
                ctx.lineCap = 'butt'; // round ends would overlap where the see-through pieces meet and show as dots
                for (var s = 0; s < path.length - 1; s++) {
                    var move = moves[moves.length - 1 - s];
                    var age = (now - move.at) / TRAIL_TIME; // 0 newest .. 1 gone
                    var i = Math.round(Math.max(0.3, move.level) * 1000); // slow parts still show
                    ctx.globalAlpha = (1 - age) * opacities[i];
                    ctx.strokeStyle = colors[i];
                    ctx.lineWidth = width * (1 - 0.7 * age);
                    ctx.beginPath();
                    ctx.moveTo(path[s].x * fit, path[s].y * fit);
                    ctx.lineTo(path[s + 1].x * fit, path[s + 1].y * fit);
                    ctx.stroke();
                }
                // A round head where the mouse is now, fading with the newest movement.
                var newest = moves[moves.length - 1];
                var j = Math.round(Math.max(0.3, newest.level) * 1000);
                ctx.globalAlpha = (1 - (now - newest.at) / TRAIL_TIME) * opacities[j];
                ctx.fillStyle = colors[j];
                ctx.beginPath();
                ctx.arc(0, 0, width * 0.6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
                drawn = true;
                return true;
            }

            // Frames run only while something is shown: the loop stops when everything has faded and
            // movement wakes it, so a still mouse costs nothing.
            var draw = STYLE === 'arrow' ? drawArrow : STYLE === 'trail' ? drawTrail : drawRing;
            var last = 0;         // time of the last frame, or of the movement that woke the loop
            var running = false;  // a frame is requested
            function frame(now) {
                var dt = Math.max(1, now - last);
                if (dt > STALE) pendingX = pendingY = 0;
                var dx = pendingX, dy = pendingY;
                pendingX = pendingY = 0;
                last = now;
                running = draw(dx, dy, dt, now);
                if (running) requestAnimationFrame(frame);
            }

            function wake() {
                if (running) return;
                running = true;
                last = performance.now();
                requestAnimationFrame(frame);
            }

            if (STYLE === 'ring') buildRing(); else buildCanvas();
            buildColors();
            Overlay.reportSize(SIZE, SIZE);
            Overlay.connect(['move']).on('move', function (dx, dy) {
                pendingX += dx;
                pendingY += dy;
                wake();
            });
        })();
    </script>
</body>
</html>
