<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mouse movement</title>
    <link rel="stylesheet" href="theme.css">
    <script src="overlay.js"></script>
    <style>
        body { position: relative; }
        .segment {
            position: absolute;
            box-sizing: border-box;
            border-radius: 50%;
            border: 2px solid var(--line);
            opacity: 0;
        }
    </style>
</head>
<body>
    <script>
        // mouse-move.html?size=400&sens=1
        // A ring that lights up in the direction the mouse moves; faster movement is brighter and redder.
        // Animation and color table follow mouse-movement.html from Zergatul.Obs.InputOverlay (MIT).
        (function () {
            'use strict';

            var SIZE = Math.round(Overlay.number('size', 400, 120, 2000)); // page width and height in px
            var SENSITIVITY = Overlay.number('sens', 1, 0.05, 20);          // raise for low DPI mice
            var COUNT = 30;               // segments in the ring
            var FADE = 1.005;             // brightness is divided by this every millisecond
            var SPEED_FACTOR = 0.00001;   // counts per second -> brightness
            var NEIGHBOURS = 1;           // segments on each side that also light up
            var NEIGHBOUR_FALLOFF = 2;

            // Brightness 0..1 -> color. The first row must have opacity 0 (not moving = invisible).
            var GRADIENT = [
                { r: 45, g: 100, b: 38, a: 0.0, at: 0.0 },
                { r: 45, g: 100, b: 38, a: 1.0, at: 0.3 },
                { r: 255, g: 225, b: 61, a: 1.0, at: 0.5 },
                { r: 255, g: 61, b: 61, a: 1.0, at: 0.8 },
                { r: 255, g: 61, b: 61, a: 1.0, at: 1.0 }
            ];

            var segmentWidth = Math.round(SIZE * 0.066);
            var segmentHeight = Math.round(segmentWidth / 2);
            var radius = SIZE / 2 - segmentWidth / 2 - 6;
            var segments = [];
            var colors = [], opacities = [];
            var pendingX = 0, pendingY = 0;

            function buildRing() {
                for (var i = 0; i < COUNT; i++) {
                    var angle = 2 * Math.PI * i / COUNT;
                    var div = document.createElement('div');
                    div.className = 'segment';
                    div.style.width = segmentWidth + 'px';
                    div.style.height = segmentHeight + 'px';
                    div.style.left = (SIZE / 2 + Math.cos(angle) * radius - segmentWidth / 2).toFixed(2) + 'px';
                    div.style.top = (SIZE / 2 + Math.sin(angle) * radius - segmentHeight / 2).toFixed(2) + 'px';
                    div.style.transform = 'rotate(' + (90 + 360 * i / COUNT).toFixed(2) + 'deg)';
                    document.body.appendChild(div);
                    segments.push({ div: div, value: 0, changed: false });
                }
            }

            function buildColors() {
                function hex(v) {
                    v = Math.max(0, Math.min(255, v));
                    return (v < 16 ? '0' : '') + v.toString(16);
                }
                var row = 0;
                for (var i = 0; i <= 1000; i++) {
                    var t = i / 1000;
                    while (row < GRADIENT.length - 2 && t > GRADIENT[row + 1].at) row++;
                    var a = GRADIENT[row], b = GRADIENT[row + 1];
                    var f = b.at === a.at ? 0 : Math.min(1, Math.max(0, (t - a.at) / (b.at - a.at)));
                    colors[i] = '#' + hex(Math.round(a.r + (b.r - a.r) * f)) +
                        hex(Math.round(a.g + (b.g - a.g) * f)) + hex(Math.round(a.b + (b.b - a.b) * f));
                    opacities[i] = Math.round((a.a + (b.a - a.a) * f) * 1000) / 1000;
                }
            }

            function segment(index) {
                return segments[((index % COUNT) + COUNT) % COUNT];
            }

            function brighten(s, amount) {
                s.value = Math.min(1, s.value + amount);
                s.changed = true;
            }

            var last = null;
            function frame(now) {
                if (last !== null) {
                    var dt = Math.max(1, now - last);
                    var fade = Math.pow(FADE, dt);
                    segments.forEach(function (s) {
                        if (s.value > 0) {
                            s.value = s.value / fade;
                            if (s.value < 0.001) s.value = 0;
                            s.changed = true;
                        }
                    });

                    if (pendingX !== 0 || pendingY !== 0) {
                        var index = Math.round(Math.atan2(pendingY, pendingX) / (2 * Math.PI / COUNT));
                        var speed = 1000 * Math.sqrt(pendingX * pendingX + pendingY * pendingY) / dt;
                        var amount = Math.min(1, speed * SPEED_FACTOR * SENSITIVITY);
                        brighten(segment(index), amount);
                        var falloff = NEIGHBOUR_FALLOFF;
                        for (var n = 1; n <= NEIGHBOURS; n++) {
                            brighten(segment(index - n), amount / falloff);
                            brighten(segment(index + n), amount / falloff);
                            falloff *= NEIGHBOUR_FALLOFF;
                        }
                        pendingX = pendingY = 0;
                    }

                    segments.forEach(function (s) {
                        if (!s.changed) return;
                        var i = Math.round(s.value * 1000);
                        s.div.style.backgroundColor = colors[i];
                        s.div.style.opacity = opacities[i];
                        s.changed = false;
                    });
                }
                last = now;
                requestAnimationFrame(frame);
            }

            buildRing();
            buildColors();
            Overlay.reportSize(SIZE, SIZE);
            Overlay.connect(['move']).on('move', function (dx, dy) {
                pendingX += dx;
                pendingY += dy;
            });
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
